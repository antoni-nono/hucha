<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hucha</title>
  <meta name="description" content="Tu control de gastos mensual, sencillo y pensado para cerebros con TDAH.">
  <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hucha">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div id="topTitle" class="top-title"></div>
    <button class="icon-btn" data-action="openSettings" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="hoy"><span aria-hidden="true">🏠</span>Hoy</button>
    <button data-tab="mes"><span aria-hidden="true">📊</span>Mes</button>
    <button class="fab" data-action="openAdd" aria-label="Apuntar gasto"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <button class="tab-ai" data-action="aiOpen"><span aria-hidden="true">✨</span>Asistente</button>
    <button data-tab="ahorro"><span aria-hidden="true">🐷</span>Ahorro</button>
  </nav>

  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="celebrate" class="celebrate" role="status" aria-live="polite"></div>

  <input type="file" id="fileImg" accept="image/*" hidden>
  <input type="file" id="fileBank" accept=".csv,.txt,.xls,.xlsx,text/csv" hidden>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileAi" accept="image/*" multiple hidden>

  <script src="app.js"></script>
</body>
</html>
